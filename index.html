<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Icons live in the ROOT public/ dir, same rule as og-image.png: Vercel checks
      the filesystem before rewrites, so these resolve on the apex instead of being
      swallowed by the /:username rewrite into next-app's 404. Keep .ico first and
      untyped (what Google's own docs exemplify); sizes="any" makes browsers prefer
      the SVG for the tab. Regenerate the rasters with `npm run icons`.
    -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Primary Meta Tags -->
    <title>Free Online Courses, Built by Experts | Ignite</title>
    <meta name="title" content="Free Online Courses, Built by Experts | Ignite" />
    <meta name="description" content="Discover Ignite's free, expert-led courses in Product Management, Cyber Security, Data Analysis, UX Design and more. Learn from industry experts with AI-powered lessons, real-world projects, and personalised feedback." />
    <meta name="keywords" content="product management course, product manager training, tech skills, online learning platform, professional development, career growth, interactive lessons, AI tutor, flashcards, knowledge checks, PM course, product management certification, learn product management online, tech career" />
    <meta name="author" content="Ignite Education" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="geo.region" content="GB" />
    <meta name="geo.placename" content="United Kingdom" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ignite.education/welcome" />
    <meta property="og:title" content="Free Online Courses, Built by Experts | Ignite" />
    <meta property="og:description" content="Discover Ignite's free, expert-led courses in Product Management, Cyber Security, Data Analysis, UX Design and more. Learn from industry experts with AI-powered lessons, real-world projects, and personalised feedback." />
    <meta property="og:image" content="https://ignite.education/og-image.png" />
    <meta property="og:image:secure_url" content="https://ignite.education/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:site_name" content="Ignite Education" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ignite Education - Master Product Management & Tech Skills Online" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://ignite.education/welcome" />
    <meta name="twitter:title" content="Free Online Courses, Built by Experts | Ignite" />
    <meta name="twitter:description" content="Discover Ignite's free, expert-led courses in Product Management, Cyber Security, Data Analysis, UX Design and more. Learn from industry experts with AI-powered lessons, real-world projects, and personalised feedback." />
    <meta name="twitter:image" content="https://ignite.education/og-image.png" />
    <meta name="twitter:image:alt" content="Ignite Education - Master Product Management & Tech Skills Online" />
    <meta name="twitter:site" content="@IgniteEducation" />

    <!-- Additional SEO -->
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Canonical URL (fallback - dynamically updated by SEO component).
         Points at /welcome, not "/": the apex root 308s to /welcome, and this
         shell is only reachable via the SPA catch-all on an unmatched path.
         Self-canonicalling at "/" pointed Google at a URL that redirects away. -->
    <link rel="canonical" href="https://ignite.education/welcome" />

    <!-- Preconnect to external domains for performance -->
    <link rel="preconnect" href="https://yjvdakdghkfnlhdpbocg.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://yjvdakdghkfnlhdpbocg.supabase.co" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://www.googletagmanager.com" crossorigin />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link rel="preconnect" href="https://yjvdakdghkfnlhdpbocg.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://yjvdakdghkfnlhdpbocg.supabase.co" />
    <!-- Structured Data for Organization (static, kept for all pages) -->
    <script type="application/ld+json" data-seo="keep-static">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "Ignite Education",
      "alternateName": "Ignite",
      "description": "Interactive online learning platform specializing in product management and tech skills development with AI-powered personalized learning",
      "url": "https://ignite.education",
      "logo": {
        "@type": "ImageObject",
        "url": "https://ignite.education/ignite-logo.png"
      },
      "sameAs": [
        "https://www.linkedin.com/school/ignite-courses"
      ],
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "113 Brook Drive",
        "addressLocality": "London",
        "postalCode": "SE11 4TU",
        "addressCountry": "GB"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "Customer Support",
        "email": "hello@ignite.education",
        "availableLanguage": "en"
      },
      "offers": {
        "@type": "AggregateOffer",
        "category": "Education",
        "priceCurrency": "GBP",
        "lowPrice": "0",
        "highPrice": "299"
      }
    }
    </script>
    <!-- Structured Data for WebSite (static, kept for all pages) -->
    <script type="application/ld+json" data-seo="keep-static">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Ignite",
      "alternateName": "Ignite Education",
      "url": "https://ignite.education/"
    }
    </script>
    <!-- Note: Course, FAQ, and Breadcrumb schemas are now generated dynamically per page by the SEO component -->

    <!-- Loading-screen Lottie: in flight during HTML parse so the logo is there on first paint -->
    <link rel="preload" href="/icon-animation.json" as="fetch" crossorigin="anonymous" />

    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Geist:wght@100;200;300;400;500;600;700;800;900&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100;200;300;400;500;600;700;800;900&display=swap" /></noscript>

    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FH4CYRKWME"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-FH4CYRKWME');
    </script>

    <!-- Google Search Console Verification -->
    <!-- TODO: Replace content value with your verification code from https://search.google.com/search-console -->
    <!-- <meta name="google-site-verification" content="your-verification-code-here" /> -->

    <!-- Google Identity Services (for One-Tap sign-in) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
