# NOT Blueprint-synced. Every service below is maintained by hand in the Render
# dashboard; this file is the written record of that configuration, not its
# source of truth. Editing it changes nothing on its own.
#
# This is a trap worth spelling out, because it has already cost two days of
# ingest: the jobs-ingest-* crons were added here on 2026-08-09 and simply never
# existed in Render, so job_ingest_runs recorded 61 manual runs and not one cron
# run. Adding a service here means creating it in the dashboard too.
#
# Do NOT "fix" this by syncing the Blueprint. The web service was created by
# hand and Render would not adopt it — it would stand up a second copy alongside
# the live one. Note also that Render cron jobs carry a $1/month minimum each,
# so they cannot be added to the free plan the web service runs on.
services:
  # Backend API Server
  #
  # Named for the live service: ignite-education-api.onrender.com, which is what
  # VITE_API_URL and every cron startCommand below point at.
  - type: web
    name: ignite-education-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: VITE_SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: VITE_LINKEDIN_CLIENT_ID
        sync: false
      - key: VITE_LINKEDIN_CLIENT_SECRET
        sync: false
      - key: VITE_LINKEDIN_REDIRECT_URI
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: VITE_REDDIT_CLIENT_ID
        sync: false
      - key: VITE_REDDIT_CLIENT_SECRET
        sync: false
      - key: VITE_REDDIT_REDIRECT_URI
        sync: false
      - key: VITE_REDDIT_USER_AGENT
        sync: false
      # Referrals — all optional, defaults live in server.js
      - key: REFERRAL_WEEK_DAYS
        sync: false
      - key: REFERRAL_MONTHLY_CAP
        sync: false
      - key: REFERRAL_SIGNUP_WINDOW_MINUTES
        sync: false
      - key: REFERRAL_IP_DAILY_CAP
        sync: false
      # Shared cron secret. Read by /api/cron/aggregate-memory and
      # /api/cron/ingest-jobs. Set in the dashboard, and set again on EACH cron
      # service below — sync: false means Render never copies it across, and a
      # cron missing it sends "Authorization: Bearer " and gets a 401. curl
      # --fail then exits non-zero before the endpoint records anything, so the
      # failure shows up only as an empty job_ingest_runs, never as an error.
      - key: CRON_SECRET
        sync: false
      # Job board — ATS feeds need no keys; the aggregators do.
      # Adzuna was removed (its free API requires a badge on every advert that we
      # do not want on the board), so delete ADZUNA_APP_ID / ADZUNA_APP_KEY from
      # the dashboard too — they are not declared here and will not sync away.
      - key: REED_API_KEY
        sync: false
      # Board freshness cut, and the dial that governs board size more than
      # sourcing does. next-app has its own copy of this number in
      # src/data/jobsData.ts and is deployed separately — change both together,
      # and remember this value OVERRIDES the default in expire.js, so leaving
      # it behind silently reverts a change made in code.
      - key: JOBS_MAX_POSTED_AGE_DAYS
        value: "45"
      - key: JOBS_INGEST_ENABLED
        value: "true"
      - key: JOBS_INGEST_MAX_SECONDS
        value: "240"
      - key: JOBS_SUMMARIES_ENABLED
        value: "true"
      - key: JOBS_SUMMARY_MODEL
        value: "claude-sonnet-5"
      - key: JOBS_APPLY_DAILY_CAP
        value: "200"

  # Cron job to refresh Reddit cache daily at 6 AM UTC
  - type: cron
    name: reddit-cache-refresh
    schedule: "0 6 * * *"
    buildCommand: ""
    startCommand: curl -X POST https://ignite-education-api.onrender.com/api/reddit-cache/refresh

  # Job board ingest — split into separate crons rather than one so each run
  # stays bounded (Render's free plan can kill a long run), the sources' rate
  # limits are staggered, and each is independently observable in
  # job_ingest_runs. Summarisation is another for the same reason: see
  # jobs-summaries below.
  #
  # Unlike reddit-cache-refresh above, these MUST send the cron secret: they
  # spend metered third-party API quota.
  #
  # `amazon` belongs in this tier despite paging: it is single-phase, so nine
  # requests cover its whole UK board and it costs no per-job description fetch.
  - type: cron
    name: jobs-ingest-ats
    schedule: "0 5 * * *"
    buildCommand: ""
    startCommand: >-
      curl -sS --fail --max-time 600 -X POST
      -H "Authorization: Bearer $CRON_SECRET"
      -H "Content-Type: application/json"
      -d '{"sources":["greenhouse","lever","ashby","workable","amazon"]}'
      https://ignite-education-api.onrender.com/api/cron/ingest-jobs
    envVars:
      - key: CRON_SECRET
        sync: false

  # The enterprise ATS tier, ten minutes behind the fast one.
  #
  # Separate because it is a different shape of work, not just more of it: these
  # four page through their boards AND fetch a description per new job, so a
  # single slow Workday tenant could eat the whole budget. Isolating them means
  # that costs this cron, not the four sources above which are one request each.
  #
  # maxSeconds overrides JOBS_INGEST_MAX_SECONDS (240) for this request only —
  # that env var is shared by every cron, so it cannot be raised for one tier
  # without raising it for all of them. Stays under curl's --max-time 600.
  #
  # It also lands 10 minutes after a run that has already woken the free-plan
  # web service, so it skips the cold start.
  - type: cron
    name: jobs-ingest-ats-enterprise
    schedule: "10 5 * * *"
    buildCommand: ""
    startCommand: >-
      curl -sS --fail --max-time 600 -X POST
      -H "Authorization: Bearer $CRON_SECRET"
      -H "Content-Type: application/json"
      -d '{"sources":["workday","eightfold","oracle_orc","jsonld"],"maxSeconds":420}'
      https://ignite-education-api.onrender.com/api/cron/ingest-jobs
    envVars:
      - key: CRON_SECRET
        sync: false

  # The aggregator tier, DELIBERATELY NOT CREATED in Render.
  #
  # Removing Adzuna left Reed as its only source, and Reed is disabled with no
  # REED_API_KEY — its key needs a recruiter account plus contacting Reed
  # directly, so it is not self-serve (see the rationale at
  # server/jobs/sources/index.js:61-69). Standing this cron up today would buy a
  # guaranteed nightly no-op for $1/month.
  #
  # Kept here rather than deleted because the schedule is deliberate: 25 5 is
  # far enough behind the enterprise tier's 420s budget to not overlap it.
  # Create it in the dashboard when a Reed key exists.
  #
  # - type: cron
  #   name: jobs-ingest-aggregators
  #   schedule: "25 5 * * *"
  #   buildCommand: ""
  #   startCommand: >-
  #     curl -sS --fail --max-time 600 -X POST
  #     -H "Authorization: Bearer $CRON_SECRET"
  #     -H "Content-Type: application/json"
  #     -d '{"sources":["reed"]}'
  #     https://ignite-education-api.onrender.com/api/cron/ingest-jobs
  #   envVars:
  #     - key: CRON_SECRET
  #       sync: false

  # AI summaries for the board's description text. Last, at 05:45, because it
  # reads description_text that the ingests above have just rewritten — and the
  # enterprise tier can run to 420s, so 05:10 + 420s is the real constraint on
  # how early this can start. It stays at 05:45 rather than moving earlier so
  # that reviving the aggregator cron at 05:25 needs no rescheduling.
  #
  # Its own cron rather than a step inside the ingest: the ingest is capped at
  # JOBS_INGEST_MAX_SECONDS (240) and 60 sequential Claude calls at 2-5s each
  # would exhaust that budget by themselves. Capped per run, so a cold board
  # works through its backlog over a few nights rather than in one long request.
  - type: cron
    name: jobs-summaries
    schedule: "45 5 * * *"
    buildCommand: ""
    startCommand: >-
      curl -sS --fail --max-time 600 -X POST
      -H "Authorization: Bearer $CRON_SECRET"
      -H "Content-Type: application/json"
      -d '{}'
      https://ignite-education-api.onrender.com/api/cron/jobs-summaries
    envVars:
      - key: CRON_SECRET
        sync: false
