# NOT Blueprint-synced. Every service below is maintained by hand in the Render
# dashboard; this file is the written record of that configuration, not its
# source of truth. Editing it changes nothing on its own.
#
# This is a trap worth spelling out, because it cost the job board its first
# week: the jobs-ingest-* crons were added here on 2026-08-09 and simply never
# existed in Render, so job_ingest_runs recorded 75 manual runs and not one cron
# run while the board silently aged out against the 45-day read-time cut in
# next-app/src/data/jobsData.ts. Adding a service here means creating it in the
# dashboard too.
#
# Do NOT "fix" this by syncing the Blueprint. The web service was created by
# hand and Render would not adopt it — it would stand up a second copy alongside
# the live one. Note also that Render cron jobs carry a $1/month minimum each,
# so they cannot be added to the free plan the web service runs on.
#
# ── THE JOB CRONS NOW LIVE IN GITHUB ACTIONS ────────────────────────────────
# .github/workflows/jobs-ingest.yml runs the whole nightly chain. It was moved
# there precisely because of the drift above: a schedule in the repo cannot
# diverge from a dashboard nobody remembers to check, it costs nothing on a
# public repo, and GitHub emails the owner when a scheduled run fails — which
# is the alerting whose absence let the original outage run for a week.
#
# CRON_SECRET therefore has to exist in two places now: on the web service
# below (which validates it) and as a GitHub Actions repository secret (which
# sends it). They must match.
services:
  # Backend API Server
  #
  # Named for the live service: ignite-education-api.onrender.com, which is what
  # VITE_API_URL and every cron startCommand below point at.
  - type: web
    name: ignite-education-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: VITE_SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: VITE_LINKEDIN_CLIENT_ID
        sync: false
      - key: VITE_LINKEDIN_CLIENT_SECRET
        sync: false
      - key: VITE_LINKEDIN_REDIRECT_URI
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: VITE_REDDIT_CLIENT_ID
        sync: false
      - key: VITE_REDDIT_CLIENT_SECRET
        sync: false
      - key: VITE_REDDIT_REDIRECT_URI
        sync: false
      - key: VITE_REDDIT_USER_AGENT
        sync: false
      # Referrals — all optional, defaults live in server.js
      - key: REFERRAL_WEEK_DAYS
        sync: false
      - key: REFERRAL_MONTHLY_CAP
        sync: false
      - key: REFERRAL_SIGNUP_WINDOW_MINUTES
        sync: false
      - key: REFERRAL_IP_DAILY_CAP
        sync: false
      # Shared cron secret. Read by /api/cron/aggregate-memory and
      # /api/cron/ingest-jobs. Set in the dashboard, and set again on EACH cron
      # service below — sync: false means Render never copies it across, and a
      # cron missing it sends "Authorization: Bearer " and gets a 401. curl
      # --fail then exits non-zero before the endpoint records anything, so the
      # failure shows up only as an empty job_ingest_runs, never as an error.
      - key: CRON_SECRET
        sync: false
      # Job board — ATS feeds need no keys; the aggregators do.
      # Adzuna was removed (its free API requires a badge on every advert that we
      # do not want on the board), so delete ADZUNA_APP_ID / ADZUNA_APP_KEY from
      # the dashboard too — they are not declared here and will not sync away.
      - key: REED_API_KEY
        sync: false
      # Board freshness cut, and the dial that governs board size more than
      # sourcing does. next-app has its own copy of this number in
      # src/data/jobsData.ts and is deployed separately — change both together,
      # and remember this value OVERRIDES the default in expire.js, so leaving
      # it behind silently reverts a change made in code.
      - key: JOBS_MAX_POSTED_AGE_DAYS
        value: "45"
      - key: JOBS_INGEST_ENABLED
        value: "true"
      - key: JOBS_INGEST_MAX_SECONDS
        value: "240"
      - key: JOBS_SUMMARIES_ENABLED
        value: "true"
      - key: JOBS_SUMMARY_MODEL
        value: "claude-sonnet-5"
      - key: JOBS_APPLY_DAILY_CAP
        value: "200"

  # Cron job to refresh Reddit cache daily at 6 AM UTC
  - type: cron
    name: reddit-cache-refresh
    schedule: "0 6 * * *"
    buildCommand: ""
    startCommand: curl -X POST https://ignite-education-api.onrender.com/api/reddit-cache/refresh

  # ── Job board crons: MOVED TO GITHUB ACTIONS ──────────────────────────────
  #
  # jobs-ingest-ats (05:00), jobs-ingest-ats-enterprise (05:10) and
  # jobs-summaries (05:45) were declared here and never created in the Render
  # dashboard, so they never ran once. They now live in
  # .github/workflows/jobs-ingest.yml as three sequential steps of a single job,
  # which also fixes the ordering risk that three independent schedules carried:
  # GitHub can start a scheduled run 5-30 minutes late, and the summaries step
  # reads description_text that the two ingest steps rewrite.
  #
  # The payloads and the reasoning behind the split are preserved in that file.
  # Nothing about the server changed — both crons always just POSTed to
  # /api/cron/ingest-jobs, and that endpoint is unchanged.
  #
  # The aggregator tier is still not scheduled anywhere: Reed is the only
  # aggregator left and it is disabled with no REED_API_KEY, so it would be a
  # guaranteed nightly no-op. Add a step to the workflow when a key exists.
  #
  # If you ever move these back to Render, remember CRON_SECRET must be set on
  # each cron service individually — sync: false never copies it across, and a
  # cron missing it sends "Authorization: Bearer " and gets a 401 that
  # curl --fail swallows before the endpoint records anything.
